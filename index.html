<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SkyRaid" />
    <!-- standalone 起動時はステータスバーの下まで描き、safe-area で避ける（4-10） -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050a12" />
    <title>SkyRaid: Titan Skies</title>
    <meta name="description" content="__APP_DESCRIPTION__" />
    <!-- OGP（8-5。リンクのプレビュー。英語の固定の文と画像: scripts/vite-ogp.ts） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkyRaid: Titan Skies" />
    <meta property="og:title" content="SkyRaid: Titan Skies" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SkyRaid: Titan Skies — browser 3D flight shooter" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- ブランド素材（public/brand/。README の「ブランド素材の差し替え」） -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" sizes="180x180" />
    <!-- 見出しのフォント（Rajdhani 600、latin のみ使う。失敗しても system-ui で崩れない） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* スマホ: スクロール・拡大・引っ張り更新・長押し選択を止める */
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* 8-6d: body の大きさは src/core/viewport-fit.ts が測った画面の大きさ（--app-width / --app-height。無ければ 100%）。
         iOS を横向きのまま起動すると 100% の基準（初期包含ブロック）が小さいまま残り、下に黒い余白が出たため。
         contain: layout で body を position: fixed の画面（タイトル・メニュー・HUD・ダイアログ）の基準にする */
      body {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--app-width, 100%);
        height: var(--app-height, 100%);
        contain: layout;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      /* ゲームの描画は画面の端まで（8-6）。大きさは CSS で決め、描画バッファは src/core/viewport.ts が実際の大きさに合わせる。
         ボタンや HUD は各 CSS で safe-area の内側に置く */
      #app > canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* 8-6f: iOS のホーム画面から横向きで起動して描かれる高さが足りないとき、測り直させる間（viewport-fit の切り替えで
         画面がチラつく）だけ全体を隠す黒い幕（src/core/viewport-fit.ts。消えるフェードは VIEWPORT_CONFIG.nudge.coverFadeMs） */
      .viewport-cover {
        position: fixed;
        inset: 0;
        z-index: 99;
        background: #000;
        pointer-events: none;
        transition: opacity 0.25s ease;
        /* 8-7: 真っ黒のままだと固まったように見えるので、中央にタイトルのロゴ（読めなければ「SkyRaid」の文字） */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .viewport-cover.is-hiding {
        opacity: 0;
      }
      .viewport-cover-logo {
        display: block;
        width: min(46vw, 760px);
        height: auto;
        max-height: 24vh;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .viewport-cover-logo.is-loaded {
        opacity: 1;
      }
      .viewport-cover-text {
        display: none;
        font:
          italic 600 clamp(48px, 12vw, 120px) / 1 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0.02em;
        color: #e6fbff;
      }
      .viewport-cover.is-text .viewport-cover-logo {
        display: none;
      }
      .viewport-cover.is-text .viewport-cover-text {
        display: block;
      }
      /* 起動できないときの案内（8-3。src/ui/compat-notice.ts と src/legacy/legacy-check.js）。アプリの CSS が読めなくても出す */
      .compat-notice {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: auto;
        touch-action: pan-y;
        user-select: text;
        -webkit-user-select: text;
        background: #050a12;
        color: #fff;
        font:
          15px/1.6 system-ui,
          sans-serif;
      }
      .compat-notice-box {
        max-width: 560px;
        margin: 0 auto;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 32px
          max(20px, env(safe-area-inset-left));
      }
      .compat-notice-app {
        color: rgb(110, 240, 255);
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .compat-notice-title {
        margin: 8px 0 12px;
        font-size: 20px;
      }
      .compat-notice-sub {
        margin: 20px 0 4px;
        font-size: 15px;
        color: rgb(110, 240, 255);
      }
      .compat-notice-list {
        margin: 0;
        padding-left: 20px;
      }
      .compat-notice-note,
      .compat-notice-detail {
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
      }
      .compat-notice-detail {
        font-family: ui-monospace, monospace;
        word-break: break-all;
      }
      .compat-notice-button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 24px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: rgba(110, 240, 255, 0.16);
        border: 1px solid rgba(110, 240, 255, 0.9);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 8-3: モジュールの構文を読めない古いブラウザで真っ黒にしない（ES5 の小さなスクリプト。src/legacy/legacy-check.js をビルド時に文言を埋め込んで出す: scripts/vite-legacy-check.ts。vite-ignore は Vite に束ねさせない印で、出力では消える） -->
    <script src="/legacy-check.js" defer vite-ignore></script>
  </body>
</html>
