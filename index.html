<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SkyRaid" />
    <!-- standalone 起動時はステータスバーの下まで描き、safe-area で避ける（4-10） -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050a12" />
    <title>SkyRaid: Titan Skies</title>
    <meta name="description" content="__APP_DESCRIPTION__" />
    <!-- ブランド素材（public/brand/。README の「ブランド素材の差し替え」） -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" sizes="180x180" />
    <!-- 見出しのフォント（Rajdhani 600、latin のみ使う。失敗しても system-ui で崩れない） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* スマホ: スクロール・拡大・引っ張り更新・長押し選択を止める */
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      /* 起動できないときの案内（8-3。src/ui/compat-notice.ts と src/legacy/legacy-check.js）。アプリの CSS が読めなくても出す */
      .compat-notice {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: auto;
        touch-action: pan-y;
        user-select: text;
        -webkit-user-select: text;
        background: #050a12;
        color: #fff;
        font:
          15px/1.6 system-ui,
          sans-serif;
      }
      .compat-notice-box {
        max-width: 560px;
        margin: 0 auto;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 32px
          max(20px, env(safe-area-inset-left));
      }
      .compat-notice-app {
        color: rgb(110, 240, 255);
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .compat-notice-title {
        margin: 8px 0 12px;
        font-size: 20px;
      }
      .compat-notice-sub {
        margin: 20px 0 4px;
        font-size: 15px;
        color: rgb(110, 240, 255);
      }
      .compat-notice-list {
        margin: 0;
        padding-left: 20px;
      }
      .compat-notice-note,
      .compat-notice-detail {
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
      }
      .compat-notice-detail {
        font-family: ui-monospace, monospace;
        word-break: break-all;
      }
      .compat-notice-button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 24px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: rgba(110, 240, 255, 0.16);
        border: 1px solid rgba(110, 240, 255, 0.9);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 8-3: モジュールの構文を読めない古いブラウザで真っ黒にしない（ES5 の小さなスクリプト。src/legacy/legacy-check.js をビルド時に文言を埋め込んで出す: scripts/vite-legacy-check.ts。vite-ignore は Vite に束ねさせない印で、出力では消える） -->
    <script src="/legacy-check.js" defer vite-ignore></script>
  </body>
</html>
