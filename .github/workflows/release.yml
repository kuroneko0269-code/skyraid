# v1.0.1: main への push で package.json の版にタグ（vX.Y.Z）が無ければ、タグを付けてリリースを作る。
# 本文は docs/changelog.md のその版の項（scripts/release-notes.js。URL は載せない）。
# ビルド・テスト・公開には使わない（公開は Cloudflare Pages。CLAUDE.md）。権限は GITHUB_TOKEN の contents: write だけ
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 版とタグを確かめる
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # タグがすでにあれば（版が変わっていない push）何もしない
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${version} はタグがあるので作らない"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: タグとリリースを作る
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-notes.js "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
